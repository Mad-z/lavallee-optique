<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact – La Vallée d'Optique</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.min.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header role="banner">
    <img src="assets/images/logo.jpg" alt="La Vallée d'Optique" style="height:60px; vertical-align:middle;">
    <h1>Contactez-nous</h1>
    <nav>
      <a href="index.html">Accueil</a> |
      <a href="products.html">Produits</a> |\n      <a href="blog/index.html">Blog</a> |
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <h2>Nous joindre</h2>
    <p>36 Boulevard de Kébibat, Résidence Imane, Mag 1, Rabat, Maroc</p>
    <p>Téléphone : 05 37 23 00 34</p>
    <div class="contact-form">
      <form action="#" method="post">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" required>
        <label for="email">E‑mail</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit">Envoyer</button>
      </form>
    </div>
    <h3>Plan d'accès</h3>
    <iframe src="https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q=36+Boulevard+de+K%C3%A9bibat+Rabat" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
  </main>
  <footer>
    <p>&copy; 2026 La Vallée d'Optique – Tous droits réservés.</p>
  </footer>
</body>
</html>
